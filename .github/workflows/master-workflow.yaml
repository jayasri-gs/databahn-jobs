name: Master Build

on:
  release:
    types: [ published ]

jobs:
  master-build:
    uses: databahn-ai/ci-github-workflows/.github/workflows/build-go-service.yaml@master
    with:
      service_name: ${{ github.event.repository.name }}
      service_version: "${{ github.event.release.tag_name }}"
    secrets: inherit