name: Docker Build

on:
  push:
    branches:
      - master

env:
  SERVICE_NAME: databahn-jobs
  IMAGE_TAG: ${{ github.sha }}      

jobs:
  build_docker:
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ASSUME_ROLE_ARN: ${{ secrets.ASSUME_ROLE_ARN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials from Test account
        uses: aws-actions/configure-aws-credentials@master
        with:
          role-to-assume: ${{ env.ASSUME_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Display Identity
        run: aws sts get-caller-identity

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Create ECR repository
        run: |
          aws ecr create-repository --repository-name ${{env.SERVICE_NAME}} --region ${{env.AWS_REGION}} || true

      - name: push image to ecr
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{env.SERVICE_NAME}}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          docker buildx build --push --platform linux/arm64/v8 -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .

  update_gitops:
    runs-on: ubuntu-latest
    needs: build_docker
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get Docker Image Tag
        id: docker_tag
        run: echo "::set-output name=tag::$IMAGE_TAG"

      - name: Update version to charts-version-control
        env:
          API_TOKEN_GITHUB: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          rm -rf /tmp/tmp.databahn
          mkdir -p /tmp/tmp.databahn
          cd /tmp/tmp.databahn
          git config --global user.email "githubautomationbot@databahn.ai"
          git config --global user.name "DataBahn-Github-Bot"
          git clone https://yjagdale:$API_TOKEN_GITHUB@github.com/databahn-ai/charts-version-control.git
          cd charts-version-control
          TAG="${{ steps.docker_tag.outputs.tag }}"
          echo "updating new tag to $TAG"
          sed -i "s/tag: \".*\"/tag: \"$TAG\"/" scheduled/insights-aggregation.yaml
          sed -i "s/tag: \".*\"/tag: \"$TAG\"/" scheduled/logsource-reputation-checker.yaml
          sed -i "s/tag: \".*\"/tag: \"$TAG\"/" scheduled/logsource-inactivity-checker.yaml
          sed -i "s/tag: \".*\"/tag: \"$TAG\"/" scheduled/fleet-health-checker.yaml
          git add .
          git commit -m "$TAG for $SERVICE_NAME"
          git push