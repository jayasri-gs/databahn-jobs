config:
  version: 1.0
  updated: 2024-10-04
  author: Li Yu, Derek King
  description: Process Zscaler webproxy logs
input:
  source: zscaler
  sourcetype: webproxy
  parser: zscaler
  rawPath: s3://mgxm-collections-useast1-853533826717/_weblog/feedname=Threat Team - Web/year=2025/month=2/day=26
  #rawSchemaFile: schema.json
  connector:
    name: autoloader
    options:
      multiline: true
      cloudFiles.inferColumnTypes: true
      cloudFiles.schemaLocation: dbfs:/FileStore/sirens_dev/schemas/zScalerWebProxy/dev_workflow
      # cloudFiles.schemaEvolutionMode: rescue
      cloudFiles.format: json
  streamType: streaming
transforms:
  bronze:
    meta:
      timestamp_column: event.datetime
      timestamp_format: yyyy-MM-dd HH:mm:ss
  silver:
    event_type:
      # # from https://schema.ocsf.io/1.3.0/classes/http_activity?extensions=
      - target_table: 4002_http_activity
        framework: ocsf
        fields:
          - action:
              action: rename
              value: action
          - action_id:
              action: add
              type: expression
              value: case upper(action) when 'ALLOWED' then 1 when 'DENIED' then 2 when 'UNKNOWN' then 0 else 99 end
          - activity:
              action: alias
              value: requestmethod
          - activity_id:
              action: add
              type: expression
              value: case upper(requestmethod) when 'CONNECT' then 1 when 'DELETE' then 2 when 'GET' then 3 when 'HEAD' then 4 when 'OPTIONS' then 5 when 'POST' then 6 when 'PUT' then 7 when 'TRACE' then 8 when 'OTHER' then 9 else 0 end
          - actor:
              action: add
              type: struct
          - actor.app_name:
              action: add
              type: expression
              value: url_decode(appname)
          - actor.user:
              action: add
              type: struct
          - actor.user.email_addr:
              action: alias
              value: user
          - actor.user.domain:
              action: add
              type: expression
              value: split(user,'@')[1]
          - actor.user.name:
              action: add
              type: expression
              value: split(user,'@')[0]
          - actor.user.uid:
              action: add
              type: expression
              value: split(user,'@')[0]
          # - actor.user.name:
          #     action: alias
          #     value: uid_enrichment
          # - actor.user.uid:
          #     action: alias
          #     value: uid_enrichment
          - actor.user.type_id:
              action: add
              type: literal
              value: 0 # unknown
          - app_name:
              action: add
              type: expression
              value: url_decode(appname)
          #- attacks:
          #    action: add
          #    type: struct
          #- attacks.version:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- attacks.sub_technique:
          #    action: add
          #    type: struct
          #- attacks.sub_technique.name:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- attacks.sub_technique.src_url:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- attacks.sub_technique.uid:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- attacks.tactic:
          #    action: add
          #    type: struct
          #- attacks.tactic.name:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- attacks.tactic.src_url:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- attacks.tactic.uid:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- attacks.technique:
          #    action: add
          #    type: struct
          #- attacks.technique.name:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- attacks.technique.src_url:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- attacks.technique.uid:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          - authorizations:
              action: add
              type: struct
          - authorizations.decision:
              action: alias
              value: reason
          - authorizations.policy:
              action: add
              type: literal
              value: "<placeholder>"
          - category_name:
              action: add
              type: literal
              value: Network Activity
          - category_id:
              action: add
              type: literal
              value: 4 # network activity
          - class_name:
              action: add
              type: literal
              value: HTTP Activity
          - class_uid:
              action: add
              type: literal
              value: 4002
          - disposition:
              action: alias
              value: reason
          - disposition_id:
              action: add
              type: expression
              value:
          - dst_endpoint:
              action: add
              type: struct
          - dst_endpoint.hostname:
              action: add
              type: expression
              value: url_decode(hostname)
          - dst_endpoint.ip:
              action: alias
              value: serverip
          - dst_endpoint.name:
              action: add
              type: expression
              value: url_decode(hostname)
          - dst_endpoint.domain:
              action: alias
              value: hostname_domain_parsed
          - firewall_rule:
              action: add
              type: struct
          - firewall_rule.category:
              action: add
              type: literal
              value: "<placeholder>"
          - firewall_rule.condition:
              action: add
              type: literal
              value: "<placeholder>"
          - firewall_rule.desc:
              action: add
              type: literal
              value: "<placeholder>"
          - firewall_rule.duration:
              action: add
              type: literal
              value: 0
          - firewall_rule.match_details:
              action: add
              type: literal
              value: "[<placeholder>]"
          - firewall_rule.match_location:
              action: add
              type: literal
              value: "<placeholder>"
          - firewall_rule.name:
              action: add
              type: literal
              value: "<placeholder>"
          - firewall_rule.rate_limit:
              action: add
              type: literal
              value: 0
          - firewall_rule.sensitivity:
              action: add
              type: literal
              value: "<placeholder>"
          - firewall_rule.type:
              action: add
              type: literal
              value: "<placeholder>"
          - firewall_rule.uid:
              action: add
              type: literal
              value: "<placeholder>"
          - firewall_rule.version:
              action: add
              type: literal
              value: "<placeholder>"
          - http_request:
              action: add
              type: struct
          - http_request.http_method:
              action: alias
              value: requestmethod
          - http_request.user_agent:
              action: alias
              value: useragent
          - http_request.version:
              action: alias
              value: protocol
          - http_request.referrer:
              action: alias
              value: refererURL
          - http_request.length:
              action: alias
              value: requestsize
          - http_request.url:
              action: add
              type: struct
          - http_request.url.hostname:
              action: add
              type: expression
              value: url_decode(hostname)
          - http_request.url.scheme:
              action: alias
              value: protocol
          - http_request.url.url_string:
              action: alias
              value: url
          - http_request.url.categories:
              action: add
              type: expression
              value: concat_ws(":", urlclass, urlsupercategory, urlcategory)
          - http_request.url.category_ids:
              action: add
              type: literal
              value: 99 # other; not currently mapped
          - http_response:
              action: add
              type: struct
          - http_response.content_type:
              action: alias
              value: contenttype
          - http_response.latency:
              action: alias
              value: servertranstime
          - http_response.code:
              action: alias
              value: status
          - http_response.length:
              action: alias
              value: responsesize
          - malware:
              action: add
              type: struct
          #- malware.cves:
          #    action: add
          #    type: struct
          #- malware.cves.uid:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- malware.cves.cvss:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- malware.cves.cwe:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- malware.cves.created_time:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- malware.cves.created_time_dt:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- malware.cves.desc:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- malware.cves.epss:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- malware.cves.modified_time:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- malware.cves.modified_time_dt:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- malware.cves.product:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- malware.cves.references:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- malware.cves.title:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          #- malware.cves.type:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          - malware.classification_ids:
              action: add
              type: literal
              value: [0]
          - malware.classifications:
              action: add
              type: literal
              value: "<placeholder>"
          - malware.name:
              action: add
              type: literal
              value: "<placeholder>"
          #- malware.path:
          #    action: add
          #    type: literal
          #    value: "<placeholder>"
          - malware.provider:
              action: add
              type: literal
              value: "<placeholder>"
          - malware.uid:
              action: add
              type: literal
              value: "<placeholder>"
          - metadata:
              action: add
              type: struct
          - metadata.log_name:
              action: alias
              value: _source_file
          - metadata.log_provider:
              action: alias
              value: appname
          - metadata.original_time:
              action: alias
              value: datetime
          - metadata.tenant_uid:
              action: add
              type: expression
              value: url_decode(devicehostname)
          - metadata.version:
              action: add
              type: literal
              value: 1.3.0
          - metadata.product:
              action: add
              type: struct
          - metadata.product.name:
              action: alias
              value: _sourcetype
          - metadata.product.vendor_name:
              action: alias
              value: vendor
          - severity:
              action: alias
              value: threatseverity
          - severity_id:
              action: add
              type: literal
              value: 99 # other; not currently mapped
          - src_endpoint:
              action: add
              type: struct
          - src_endpoint.hostname:
              action: add
              type: expression
              value: url_decode(devicehostname)
          - src_endpoint.ip:
              action: alias
              value: ClientIP
          - src_endpoint.name:
              action: add
              type: expression
              value: url_decode(devicehostname)
          - src_endpoint.owner:
              action: add
              type: struct
          # - src_endpoint.owner.email_addr:
          #     action: add
          #     type: expression
          #     value: case when deviceowner is null or upper(deviceowner) = 'NA' then deviceowner else concat_ws("@", deviceowner, "centene.com") end
          # - src_endpoint.owner.domain:
          #     action: add
          #     type: expression
          #     value: split(user,'@')[1]
          - src_endpoint.owner.name:
              action: alias
              value: deviceowner
          - src_endpoint.owner.uid:
              action: alias
              value: deviceowner
          - src_endpoint.owner.type_id:
              action: add
              type: literal
              value: 0 # unknown
          - status:
              action: add
              type: expression
              value: case when upper(status_code) <= 399 then 'Success' when status_code > 399 then "Failure" else "Unknown" end
          - status_code:
              action: rename
              value: status
          - status_id:
              action: add
              type: expression
              value: case when status <= 399 then 1 when status > 399 then 2 else 0 end
          - time:
              action: alias
              value: _event_time
          - traffic:
              action: add
              type: struct
          - traffic.bytes:
              action: alias
              value: transactionsize
          - traffic.bytes_in:
              action: alias
              value: requestsize
          - traffic.bytes_out:
              action: alias
              value: responsesize
          - type_uid:
              action: add
              type: expression
              value: 400200 + (case upper(requestmethod) when 'CONNECT' then 1 when 'DELETE' then 2 when 'GET' then 3 when 'HEAD' then 4 when 'OPTIONS' then 5 when 'POST' then 6 when 'PUT' then 7 when 'TRACE' then 8 when 'OTHER' then 9 else 0 end)
          - type_name:
              action: add
              type: expression
              value: concat_ws(" ", "HTTP Activity:", (case upper(requestmethod) when 'NA' then 'Unknown' else initcap(requestmethod) end))
          # - user:
          #     action: rename
          #     type: expression
          #     value: split(user,'@')[0]
          - unmapped:
              action: rename
              value: unmapped
      - target_table: web
        framework: cim
        fields:
         - _event_date:
             action: rename
             value: _event_date
         - _event_time:
             action: rename
             value: _event_time
         - _source:
             action: rename
             value: _source
         - _sourcetype:
             action: rename
             value: _sourcetype
         - actor_user_name:
             action: alias
             value: user
         - dest:
             action: alias
             value: hostname
         - dest_host:
             action: alias
             value: hostname
         - dest_ip_address:
             action: alias
             value: serverip
         - event_message:
             action: add
             type: literal
             value: HTTP Request
         - event_result:
             action: add
             type: expression
             value: case when status <= 399 then "Success" else "Failure" end
         - event_schema_file:
             action: add
             type: literal
             value: web_v0.1.2
         - event_severity:
             action: add
             type: literal
             value: Informational
         - event_type:
             action: add
             type: literal
             value: HTTP Session
         - file_content_type:
             action: alias
             value: filetype
         - file_name:
             action: alias
             value: filename
         - http_content_type:
             action: alias
             value: contenttype
         - http_referrer:
             action: alias
             value: refererURL
         - http_request_length:
             action: alias
             value: requestsize
         - http_request_method:
             action: alias
             value: requestmethod
         - http_response_length:
             action: alias
             value: responsesize
         - http_response_time:
             action: alias
             value: servertranstime
         - http_status_code:
             action: alias
             value: status
         - http_user_agent:
             action: alias
             value: useragent
         - http_version:
             action: alias
             value: protocol
         - src:
             action: add
             type: expression
             value: concat_ws(",", ClientIP, clientpublicIP)
         - src_ip_addr:
             action: add
             type: expression
             value: concat_ws(",", ClientIP, clientpublicIP)
         - threat_category:
             action: alias
             value: threatcategory
         - threat_name:
             action: alias
             value: threatname
         - threat_risk_level:
             action: alias
             value: threatclass
         - uid:
             action: alias
             value: event_id
         - url:
             action: rename
             value: url
         - url_category:
             action: add
             type: expression
             value: concat_ws(":", urlsupercategory, urlcategory)
         - user:
             action: rename
             value: user
         - user_agent:
             action: alias
             value: useragent
         - actor:
             action: add
             type: struct
         - actor.app_name:
             action: add
             type: expression
             value: url_decode(appname)
         - actor.user:
             action: add
             type: struct
         - actor.user.email_addr:
             action: alias
             value: user
         - actor.user.domain:
             action: add
             type: expression
             value: split(user,'@')[1]
         - actor.user.name:
             action: add
             type: expression
             value: split(user,'@')[0]
         - actor.user.uid:
             action: add
             type: expression
             value: split(user,'@')[0]